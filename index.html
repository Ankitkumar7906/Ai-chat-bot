<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="user-chat-box">
            
        </div>
        <div class="ai-chat-box">
            <img src="cute-robot-operating-laptop-cart-removebg-preview.png" alt="" id="aiImage" width="50">
            <div class="ai-chat-area">
             Hello ! How can I Help you Today?
            </div>
        </div>
    </div>
    <div class="prompt-area">
        <input type="text" id="prompt" placeholder="message...">
        <button id="image"><img src="icons8-gallery-48.png" alt="" width="30">
            <input type="file" accept="images/*" hidden>
        </button>
        <button id="submit"><img src="icons8-up-50.png" alt="" width="30"></button>
    </div>








    <script src="script.js"></script>
</body>
</html>
